# /etc/ao/deployer.yaml: what the deployer on the VPS deploys (release-workflow spec 2.3, 2.11; docs/vps-setup.md).
# No secret lives here: only the paths of the files that hold them, each root:aodeploy 0640.
state_dir: /var/lib/ao                      # a mirror, a record (state.json) and a work folder per project
secrets_dir: /etc/ao/secrets                # <project>/<environment>.env: the values of the variables apps name;
                                            # <project>/<environment>.db.env: those of the database, when deploy.yaml has one
caddyfile: /etc/ao/caddy/Caddyfile          # written by the deployer, read by the Caddy container
basic_auth_file: /etc/ao/caddy/basic-auth   # one line "<user> <bcrypt hash>" for Development and Staging (and Production
                                            # of a project with production_auth)
app:                                        # the GitHub App ao-deploy
  id: 5624698
  key_file: /etc/ao/ao-deploy.pem
apps:                                       # the slugs of the Apps, as audit reads them
  dev: tungph7-ao-dev
  review: tungph7-ao-review
  merge: tungph7-ao-merge                   # merge-gate's own App (Pilot 3, spec 2.9); leave it out until you make it
jira_token_file: /etc/ao/jira-read.token    # read-only token of the CI account, for the docs PR rule of audit
approvers: [TungPH7]                        # AO_APPROVERS: the logins whose deployment requests count
# The encrypted copies of the database backups, which your machine pulls as aobackup (Pilot 3, spec 2.4;
# docs/vps-setup.md, section 16). ao-backup reads it; the deployer does not.
# backup:
#   age_recipient: age1…                    # the public key from ao-backup-pull.mjs keygen
# A project with one public app gives one host for each environment, as below. With two or more public apps, each app
# gives its own (project-scaffold part 2, spec 2.4; docs/vps-setup.md, section 11):
#   hosts:
#     user: { development: shop-dev.ao.t2g.io.vn, staging: shop-staging.ao.t2g.io.vn, production: shop.ao.t2g.io.vn }
#     admin: { development: shop-admin-dev.ao.t2g.io.vn, staging: shop-admin-staging.ao.t2g.io.vn, production: shop-admin.ao.t2g.io.vn }
# production_auth: true keeps Production behind the same basic auth until the project opens to everyone (Pilot 3,
# spec 2.2). Only root sets it here, so no pull request can open Production.
projects:
  - name: pilot
    repo: TungPH7/ao-pilot
    space: DEMO
    hosts:
      development: pilot-dev.ao.t2g.io.vn
      staging: pilot-staging.ao.t2g.io.vn
      production: pilot.ao.t2g.io.vn
  - name: sample
    repo: TungPH7/ao-sample
    space: SMP
    hosts:
      development: sample-dev.ao.t2g.io.vn
      staging: sample-staging.ao.t2g.io.vn
      production: sample.ao.t2g.io.vn
