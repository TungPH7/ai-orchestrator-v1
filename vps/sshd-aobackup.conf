# /etc/ssh/sshd_config.d/60-aobackup.conf (Pilot 3, spec 2.4; docs/vps-setup.md, section 16): the account aobackup only
# reads the encrypted copies of the database backups, over SFTP, inside /var/backups/ao-offsite, with its own key. No
# shell, no TTY, no forwarding of any kind. The folder must belong to root and be writable by root only, as sshd wants
# of a ChrootDirectory; ao-backup makes it so.
Match User aobackup
    ChrootDirectory /var/backups/ao-offsite
    ForceCommand internal-sftp -R
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    X11Forwarding no
    PermitTTY no
# Back to every user, so no line read after this file falls under the block above.
Match all
