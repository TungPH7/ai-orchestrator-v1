# Builds each profile of profiles/ in a temporary folder and runs its lint, typecheck, test:coverage and build
# (project-scaffold spec 3). Only when a PR or a push to main changes a profile or what copies one: npm ci of a profile
# takes a minute or two.
name: profiles

on:
  pull_request:
    paths: ['profiles/**', 'lib/scaffold/**', 'scripts/profiles-check.mjs', '.github/workflows/profiles.yml']
  push:
    branches: [main]
    paths: ['profiles/**', 'lib/scaffold/**', 'scripts/profiles-check.mjs', '.github/workflows/profiles.yml']

permissions:
  contents: read

concurrency:
  group: profiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run profiles:check
