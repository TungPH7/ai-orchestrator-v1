# Builds each profile of profiles/ in a temporary folder and runs its lint, typecheck, test:coverage and build
# (project-scaffold spec 3), and base-pnpm with the stacks of profiles/stacks/ (part 2, spec 2.3). Only when a PR or a
# push to main changes a profile or what copies one: installing the packages of a profile takes a few minutes. pnpm
# comes from corepack, which Node 24 ships, at the version that packageManager of base-pnpm names.
name: profiles

on:
  pull_request:
    paths: ['profiles/**', 'lib/scaffold/**', 'lib/quality/package-manager.mjs', 'scripts/profiles-check.mjs', '.github/workflows/profiles.yml']
  push:
    branches: [main]
    paths: ['profiles/**', 'lib/scaffold/**', 'lib/quality/package-manager.mjs', 'scripts/profiles-check.mjs', '.github/workflows/profiles.yml']

permissions:
  contents: read

concurrency:
  group: profiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The root scripts of a pnpm project call pnpm through a shell, so it must be on the PATH: the shims of corepack.
      - run: corepack enable pnpm
      - run: npm run profiles:check
